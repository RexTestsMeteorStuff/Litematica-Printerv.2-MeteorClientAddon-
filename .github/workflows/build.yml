name: Build Litematica Printer2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Litematica-Printer2-GitHub-Source/Litematica-Printer2

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Litematica-Printer2-JAR
          path: Litematica-Printer2-GitHub-Source/Litematica-Printer2/build/libs/*.jar
          if-no-files-found: error
